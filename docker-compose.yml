version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:./prisma/dev.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_stripe_secret_key_placeholder}
    volumes:
      - sqlite-data:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_stripe_publishable_key_placeholder}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
